<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var _t=localStorage.getItem('fra:theme');if(_t)document.documentElement.dataset.theme=_t}catch(e){}</script>
<title>404 — Francy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17132b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%A9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17132b; --ink:#f4f1ff; --mute:#a9a2d1; --line:#3a3263;
  --accent:#ffb38a; --accent-ink:#1b1636; --glow:#6c4cff;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f5f3ff; --ink:#1b1636; --mute:#5f5887; --line:#cfc8f5;
    --accent:#d2491f; --accent-ink:#ffffff; --glow:#a99cff; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f3ff; --ink:#1b1636; --mute:#5f5887; --line:#cfc8f5;
  --accent:#d2491f; --accent-ink:#ffffff; --glow:#a99cff; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#17132b; --ink:#f4f1ff; --mute:#a9a2d1; --line:#3a3263;
  --accent:#ffb38a; --accent-ink:#1b1636; --glow:#6c4cff; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;text-align:center;
  padding:2rem;overflow:hidden;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(520px circle at var(--x,50%) var(--y,40%),color-mix(in srgb,var(--glow) 38%,transparent),transparent 70%);
}
main{position:relative}
h1{
  font:800 clamp(7rem,32vw,20rem)/.85 var(--display);letter-spacing:-.05em;margin:0;
  background:radial-gradient(circle 1.6em at var(--hx,50%) var(--hy,50%),#ffe0cc 0,#ffb38a 10%,#a98bff 34%,#5b45c4 58%,#2d2560 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  padding:.1em .1em .2em;
}
p{color:var(--mute);margin:1rem 0 2rem;font-size:clamp(1.1rem,2.6vw,1.4rem)}
a{
  display:inline-block;padding:.85rem 1.5rem;border-radius:999px;text-decoration:none;font-weight:500;
  background:var(--accent);color:var(--accent-ink);transition:transform .2s,box-shadow .2s;
}
a:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.found{margin:1.6rem auto 0;width:fit-content;max-width:100%;padding:.55rem 1.1rem;border:1px solid var(--accent);border-radius:999px;font-size:.92rem;color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}
</style>
</head>
<body>
<main>
  <h1 id="n">404</h1>
  <p>Questa pagina non l'ho mai fatta.</p>
  <a href="/">Torna al sito</a>
  <div class="found" id="found" hidden>🏆 Obiettivo segreto sbloccato! Torna al sito per riscuoterlo.</div>
</main>
<script>
(function(){
  // Segna la scoperta (stesso sito = stessa memoria del browser): il sito principale sblocca l'obiettivo
  try{
    if(!localStorage.getItem('fra:found404')){
      localStorage.setItem('fra:found404','1');
      document.getElementById('found').hidden=false;
    }
  }catch(e){}
  var h=document.getElementById('n');
  function move(x,y){
    document.body.style.setProperty('--x',x+'px');
    document.body.style.setProperty('--y',y+'px');
    var r=h.getBoundingClientRect();
    h.style.setProperty('--hx',(x-r.left)+'px');
    h.style.setProperty('--hy',(y-r.top)+'px');
  }
  var queued=false,px=0,py=0;
  window.addEventListener('pointermove',function(e){
    px=e.clientX;py=e.clientY;
    if(queued)return;queued=true;
    requestAnimationFrame(function(){queued=false;move(px,py);});
  },{passive:true});
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    // senza mouse l'alone gira piano da solo, finché non muovi il puntatore
    var moved=false;
    window.addEventListener('pointermove',function(){moved=true;},{once:true});
    (function drift(t){
      if(moved)return;
      var w=innerWidth,hh=innerHeight;
      move(w*(.5+.28*Math.sin(t/1900)),hh*(.4+.2*Math.sin(t/1300+1)));
      requestAnimationFrame(drift);
    })(0);
  }
})();
</script>
</body>
</html>
